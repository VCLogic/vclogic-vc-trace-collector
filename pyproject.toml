[project]
name = "vc-trace-collector"
version = "0.1.0"
description = "Collect auditable, source-linked public traces for venture capital investors"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "ddgs>=9,<10",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
youtube = ["yt-dlp>=2025.1"]
av = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
]
av-local = [
    "openai-whisper>=20250625",
    "pyannote-audio>=3.3,<4",
    "torch>=2.4",
]

[project.scripts]
vc-trace-collector = "vc_trace_collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
markers = ["live: tests that access public internet resources"]
testpaths = ["tests"]

[tool.ruff.lint]
# Typer deliberately declares CLI metadata in default values. Broad catches are
# limited to source-isolation and validation boundaries where errors are logged.
ignore = ["B008", "BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["src/vc_trace_collector"]

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/.worktrees",
    "/outputs",
]
